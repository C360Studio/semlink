schema: spec-driven

context: |
  # SemLink Project Context

  ## Purpose

  SemLink is the MAVLink companion and mesh project for C360 robotics demos. The
  current implementation is a SemStreams-consuming ground-control demo for a
  simulated UAV swarm. The forward direction is ADR 003: a vehicle-local
  companion service for MAVLink devices that projects current state, evaluates
  local rules, and exchanges selected semantic state across intermittent peer
  links.

  SemLink should make MAVLink and companion-computer behavior tangible without
  turning SemStreams into a GCS, SemOps into a vehicle daemon, or SemConnect
  into the internal robotics protocol.

  ## Product Boundary

  - SemLink owns MAVLink decoding, source adapters, bounded raw telemetry lanes,
    vehicle-local projection, companion-service packaging, mesh summaries,
    local rules, command-intent evidence, and compact operator views for the
    companion node.
  - SemOps owns the broad COP and fusion product: cross-feed assimilation,
    incident-scale dashboards, scenario orchestration, and multi-source
    operational workflows.
  - SemStreams owns the governed graph substrate: NATS/JetStream, graph
    mutation/query APIs, ENTITY_STATES, projection contracts, ownership claims,
    indexing profiles, lifecycle primitives, local CAS, and reusable framework
    utilities.
  - SemConnect owns OGC API - Connected Systems bridge behavior and conformance
    claims. SemLink may publish a curated, low-rate standards view, but CS API
    is not the internal swarm protocol.

  ## Standing Technical Conventions

  - Raw MAVLink frames stay on bounded raw lanes and do not replicate over the
    mesh by default.
  - Graph writes represent current state, alerts, command intent, rule traces,
    provenance, and confidence rather than one graph entity per raw frame.
  - Every graph writer declares SemStreams projection and ownership contracts
    before integration.
  - SemStreams KVRevision, EntityState.Version, and timestamps are local
    substrate metadata, not distributed mesh causality metadata.
  - Mesh replication uses explicit origin, sequence or hybrid logical time,
    expiry, payload hash, and merge-policy metadata.
  - Current telemetry is TTL-bound and mergeable only within the owning origin
    cell.
  - Command intents never execute merely because they arrived over the mesh.
    Local authority, safety profile, simulator/hardware mode, ACK observation,
    and post-state polling decide whether a command can transmit.
  - Prefer deterministic simulator or SITL evidence before hardware claims.
  - Prefer SemOps MAVLink prior art where scoped: parser, UDP listener, bounded
    raw lane, replay fixtures, COMMAND_LONG / COMMAND_ACK helpers, and SITL
    gate patterns.
  - Large product-boundary changes, mesh protocol changes, command-transmit
    changes, or SemStreams contract migrations use OpenSpec before code changes.

  ## Initial Product Slice

  The first OpenSpec-governed slice is the ADR 003 companion-mesh pivot:

  - several boat-local SemLink nodes, each with local SemStreams state;
  - a deterministic multi-boat simulator and ArduRover / ArduPilot SITL lane
    without Gazebo as the first autopilot fidelity proof;
  - bounded delta-state mesh synchronization with per-origin watermarks and
    TTLs;
  - local rule evaluation over mesh-visible state with traceable decisions; and
  - simulator-only command transmit gates before any hardware transmit surface.

rules:
  proposal:
    - Keep SemOps, SemLink, SemConnect, and SemStreams product boundaries explicit.
    - Call out simulator/SITL evidence before hardware claims for MAVLink behavior.
  specs:
    - Use OpenSpec delta sections such as ADDED or MODIFIED requirements.
    - Keep mesh synchronization metadata distinct from SemStreams local CAS metadata.
  tasks:
    - Break work into small validation-friendly implementation slices.
