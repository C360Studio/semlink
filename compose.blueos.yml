services:
  semlink-blueos-extension:
    build:
      context: ${SEMLINK_ROOT:-.}
      dockerfile: docker/blueos-extension/Dockerfile
      additional_contexts:
        semstreams: ${SEMSTREAMS_ROOT:-../semstreams}
    env_file:
      - ${SEMLINK_HANDOFF_PROFILE_FILE:-./configs/handoff/companion.env.example}
    environment:
      SEMLINK_HANDOFF_PROFILE: "/data/companion.env"
    volumes:
      - ${SEMLINK_HANDOFF_PROFILE_FILE:-./configs/handoff/companion.env.example}:/data/companion.env:ro
    ports:
      - "${SEMLINK_BLUEOS_HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
