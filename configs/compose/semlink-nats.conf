# SemLink demo NATS server config.
#
# Use explicit JetStream limits instead of Docker-derived defaults. On Docker
# Desktop, auto-sizing can report too little available storage and reject KV or
# stream creation with err_code=10047.

http_port: 8222

jetstream {
    store_dir: "/data"
    max_file_store: 2GB
    max_memory_store: 512MB
}
